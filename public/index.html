<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Clarion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#264a6f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Look and feel follow the Highways Climate Impact Toolkit and the FHRG website: the FHRG navy,
   paper and haze greys, Atkinson Hyperlegible Next, junction-plate badges, a left rail of sections
   beside one content column up to 1240px (a top bar on phones). Dark mode keeps the same tokens on a
   navy-black ground. */
:root {
  --navy: #264a6f; --navy-deep: #1a3452; --plate: #111820; --plate-ring: #ffffff;
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --ink: #17212c; --ink-2: #46566a; --ink-3: #5f7088; --heading: #1a3452;
  --line: #e4e9ef; --line-2: #a9b6c7; --accent: #264a6f; --accent-2: #1a3452; --accent-ink: #ffffff; --accent-wash: #e6edf5;
  --focus: #f2b705; --good: #2f7a4f; --warn: #c98f16; --crit: #a33a2e; --good-ink: #2f7a4f; --warn-ink: #8a5d0e; --crit-ink: #a33a2e; --data: #6a4c93;
  --s1: #264a6f; --s2: #d9731f; --serious: #d9731f; --serious-ink: #9a4a0e;
  --h-s0: #eef3fa; --h-s1: #d2e1f3; --h-s2: #a9c4e4; --h-s3: #6d97c9; --h-s4: #3d6a9c; --h-s5: #1a3452;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px; --radius-sm: 8px; --shadow: 0 10px 30px rgba(26, 52, 82, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plate: #06090d; --plate-ring: #c9d4e0; --bg: #0f1620; --surface: #17212c; --surface-2: #1f2b39; --ink: #e8edf3; --ink-2: #b5c0cd; --ink-3: #8b98a8; --heading: #dbe5f0;
    --line: #2a3646; --line-2: #42526a; --accent: #5f93d6; --accent-2: #8db5ea; --accent-ink: #0b1420; --accent-wash: #1c2f47; --focus: #f2c94c;
    --good-ink: #6fcf8f; --warn-ink: #f2c94c; --crit-ink: #ff8f85; --data: #7b5cb0; --s1: #6ea3e0; --s2: #e38a3e; --serious-ink: #f0a068; --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); color-scheme: dark;
    --h-s0: #19232f; --h-s1: #1c3554; --h-s2: #24568f; --h-s3: #3576c3; --h-s4: #6ea3e0; --h-s5: #aacbf2;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -0.01em; color: var(--heading); }
h1 { font-size: 1.85rem; } h2 { font-size: 1.4rem; } h3 { font-size: 1.1rem; } h4 { font-size: 0.98rem; color: var(--ink); }
p { margin: 0; max-width: 70ch; }
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-2); text-decoration-thickness: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.small { font-size: 0.86rem; } .muted { color: var(--ink-3); } .note { font-size: 0.88rem; color: var(--ink-3); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem; color: var(--ink-3); font-weight: 700; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* the FHRG logo sits on a white plate, so it reads in dark mode too */
.fhrg-logo { display: block; height: auto; max-width: 100%; }
.brand-logo { display: inline-block; background: #fff; border-radius: var(--radius-sm); padding: 4px 6px; line-height: 0; }
.brand-logo .fhrg-logo { width: 176px; }

/* shell */
.top { background: var(--navy-deep); color: #fff; }
.top-in, .defaults, .tabs-in, .page { max-width: 1320px; margin-inline: auto; }
.top-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px; padding: 10px clamp(16px, 3vw, 36px) 6px; }
.brand { display: flex; align-items: center; gap: 12px; } .brand-logo .fhrg-logo { width: 132px; }
.brand-mark { font-weight: 800; font-size: 1.25rem; line-height: 1.1; color: #fff; } .brand-sub { font-size: 0.84rem; color: #d2e1f3; }
.pickers { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.picker { display: grid; gap: 3px; font-size: 0.78rem; color: #d2e1f3; } .picker select { min-height: 40px; max-width: 220px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid #6d97c9; background: #fff; color: #1a3452; font-weight: 600; font-size: 0.92rem; }
.top-who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.82rem; color: #d2e1f3; } .top-who .btn { color: #fff; border-color: #6d97c9; background: none; }
.defaults { margin-block: 0; padding: 0 clamp(16px, 3vw, 36px) 8px; font-size: 0.82rem; color: #d2e1f3; }
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); } .tabs-in { display: flex; flex-wrap: wrap; gap: 2px; padding-inline: clamp(16px, 3vw, 36px); }
.tab { display: inline-flex; align-items: center; gap: 7px; min-height: 46px; padding: 8px 10px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--ink-2); font-weight: 600; cursor: pointer; }
.tab[aria-current="page"] { color: var(--heading); border-bottom-color: var(--accent); font-weight: 800; } .tab.gap { margin-left: auto; }
.tab-n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--heading); font-size: 0.8rem; font-weight: 800; } .tab[aria-current="page"] .tab-n { background: var(--accent); color: var(--accent-ink); }
.main { min-width: 0; padding-inline: clamp(16px, 3vw, 36px); padding-block: 18px 60px; }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head > div:not(.row) { display: grid; gap: 6px; min-width: 0; }
.page-head p { color: var(--ink-2); font-size: 1.02rem; }
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 32, 0.45); z-index: 35; }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 12px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 6px 14px; }
.card-head > div:not(.row) { display: grid; gap: 3px; min-width: 0; }
.card-head p { color: var(--ink-3); font-size: 0.9rem; }
.grid { display: grid; gap: 18px; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-wide { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 1080px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-wide { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .g2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .g4 { grid-template-columns: minmax(0, 1fr); } }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.spacer { flex: 1; }
.callout { border-left: 5px solid var(--accent); background: var(--bg); padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 0.94rem; }
.callout.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.callout.crit { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 11%, var(--surface)); }
.prose { display: grid; gap: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 72ch; }
.stat { display: grid; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.stat .label { font-size: 0.88rem; color: var(--ink-2); font-weight: 600; }
.stat .value { font-weight: 800; font-size: 1.8rem; line-height: 1.15; color: var(--heading); letter-spacing: -0.015em; }
.stat .detail { font-size: 0.84rem; color: var(--ink-3); }
.plate { display: inline-flex; align-items: center; justify-content: center; min-width: 2em; padding: 1px 6px; border-radius: 4px; background: var(--plate); color: #fff; box-shadow: 0 0 0 2px var(--plate-ring); font-weight: 800; font-size: 0.74rem; letter-spacing: 0.04em; line-height: 1.5; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; border: 1.5px solid var(--line-2); background: var(--surface); white-space: nowrap; }
.pill.ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.pill.warn { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn) 60%, var(--line)); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.pill.bad { color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 60%, var(--line)); }
.pill.serious { color: var(--serious-ink); border-color: color-mix(in srgb, var(--serious) 60%, var(--line)); background: color-mix(in srgb, var(--serious) 12%, var(--surface)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--ink-2); text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--accent); }

/* buttons and forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius-sm); border: 2px solid var(--accent); background: var(--surface); padding: 6px 14px; cursor: pointer; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; line-height: 1.3; }
.btn:hover { background: var(--bg); color: var(--accent-2); border-color: var(--accent-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent-ink); }
.btn.small { padding: 3px 10px; font-size: 0.86rem; border-width: 1.5px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--bg); border-color: transparent; }
.btn.danger { border-color: var(--crit); color: var(--crit-ink); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
label.field, div.field { display: grid; gap: 4px; align-content: start; font-size: 0.9rem; color: var(--ink); font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea, select.input, input.input, textarea.input { border: 1.5px solid var(--line-2); background: var(--surface); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--ink); width: 100%; min-width: 0; font-weight: 400; }
.field input:focus, .field select:focus, .field textarea:focus, select.input:focus, input.input:focus, textarea.input:focus { border-color: var(--accent); outline: 3px solid color-mix(in srgb, var(--accent) 22%, transparent); outline-offset: 0; }
.field .hint { font-weight: 400; color: var(--ink-3); font-size: 0.82rem; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.check input { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
.err { color: var(--crit-ink); font-size: 0.92rem; font-weight: 600; } .ok { color: var(--good-ink); font-size: 0.92rem; font-weight: 600; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th { background: var(--bg); font-weight: 700; white-space: nowrap; font-size: 0.86rem; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tab-row { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--line); }
.tab-row button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab-row button:hover { color: var(--accent); }
.tab-row button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.empty { padding: 26px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: var(--radius); }
progress.bar { width: 100%; height: 6px; accent-color: var(--accent); }

/* sign in: a navy sign holding a white card, like the website's hero */
.auth { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.auth-sign { width: min(560px, 100%); background: var(--navy); border-radius: 18px; padding: clamp(10px, 2.5vw, 16px); box-shadow: inset 0 0 0 6px var(--navy), inset 0 0 0 10px #fff, 0 18px 40px rgba(26, 52, 82, 0.22); }
.auth-card { display: grid; gap: 16px; background: var(--surface); border-radius: 10px; padding: 26px 24px; margin: 6px; }
.auth-card .fhrg-logo { width: 220px; }
.auth-form .row .btn { white-space: normal; text-align: center; }
@media (max-width: 520px) { .auth-form .row .btn { flex: 1 1 100%; } }
.auth-title { font-size: 1.45rem; }
.auth-form { gap: 8px; border-top: 2px solid var(--line); padding-top: 14px; }
.auth-sub { font-size: 1.15rem; margin: 0; }
@media (max-width: 520px) { .auth-sign { border-radius: 14px; } .auth-card { padding: 20px 16px; } }

/* Clarion */
.gap { gap: 18px; }
.lead { font-size: 1.12rem; font-weight: 600; color: var(--heading); max-width: 70ch; }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); padding-top: 10px; }
.card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.card details summary, details.no-print summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.note-row { display: grid; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.note-row:last-child { border-bottom: 0; }
.field textarea { width: 100%; }
.busy { display: grid; gap: 10px; place-items: center; min-height: 100%; align-content: center; }
/* heat tables, as in the Climate Tool */
.heat-wrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 2px; font-size: 0.84rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.heat th { font-weight: 700; color: var(--ink-2); padding: 4px 6px; text-align: left; white-space: nowrap; }
.heat thead th { font-size: 0.78rem; text-align: center; vertical-align: bottom; white-space: normal; min-width: 64px; }
.heat td { text-align: center; padding: 6px 4px; border-radius: 4px; min-width: 58px; color: var(--ink); }
.h-s0 { background: var(--h-s0); } .h-s1 { background: var(--h-s1); } .h-s2 { background: var(--h-s2); } .h-s3 { background: var(--h-s3); }
.h-s4 { background: var(--h-s4); } .h-s5 { background: var(--h-s5); }
.heat td.h-s4, .heat td.h-s5 { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .heat td.h-s4, :root:not([data-theme="light"]) .heat td.h-s5 { color: #0b0f14; } }
.heat-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 0.8rem; color: var(--ink-3); }
.heat-legend i { display: inline-block; width: 22px; height: 12px; border-radius: 2px; vertical-align: middle; }

/* the demonstration */
.demo-banner { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line)); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 0.92rem; }

/* attention against concern */
.quad-wrap { overflow-x: auto; }
.quad { width: 100%; min-width: 540px; height: auto; display: block; }
.q-red { stop-color: #e8b9ae; } .q-yellow { stop-color: #f5e6b0; } .q-blue { stop-color: #c9d6e4; } /* the blue is a tint of the navy in the site's colours */
.q-arrow { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .q-red { stop-color: #5e322c; } :root:not([data-theme="light"]) .q-yellow { stop-color: #524829; } :root:not([data-theme="light"]) .q-blue { stop-color: #1c2f47; } }
:root[data-theme="dark"] .q-red { stop-color: #5e322c; } :root[data-theme="dark"] .q-yellow { stop-color: #524829; } :root[data-theme="dark"] .q-blue { stop-color: #1c2f47; }
.q-line { stroke: var(--line-2); stroke-width: 1; }
.q-dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.q-dot.early { fill: var(--s2); }
.q-name { fill: var(--ink); font-size: 12.5px; }
.q-name.early { font-weight: 700; }
.q-zone-name { fill: var(--ink-2); font-size: 12.5px; font-weight: 700; }
.q-zone-name.early { fill: color-mix(in srgb, var(--serious-ink) 75%, var(--ink)); }
.q-axis { fill: var(--ink-3); font-size: 12px; }
.quiet-row { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.quiet-row:last-child { border-bottom: 0; padding-bottom: 0; }

/* street surveys */
.q-list { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.local { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); }
.site-row { display: grid; gap: 8px; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr) auto; align-items: end; }
@media (max-width: 640px) { .site-row { grid-template-columns: minmax(0, 1fr); } }
.site-entry { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.site-entry:first-child { border-top: 0; padding-top: 0; }
.site-head { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.site-head p { margin: 2px 0 0; }
.site-num { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 0.9rem; }
.site-name { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; }
.plates { display: flex; flex-wrap: wrap; gap: 6px; }
.plates button { min-height: 34px; padding: 4px 11px; border: 1.5px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 0.86rem; cursor: pointer; }
.plates button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
.aud-row { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.86rem; margin: 5px 0; }
.aud-row > div { display: grid; gap: 2px; }
.aud-row i { display: block; height: 9px; border-radius: 2px; }
.aud-bars .this, .aud-key .this { background: var(--accent); }
.aud-bars .all, .aud-key .all { background: var(--line-2); }
.works-wrap { overflow-x: auto; }
.works-mark { stroke: var(--ink-2); }
.works-chart { display: block; width: 100%; min-width: 640px; height: auto; }
.aud-key b { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.aud-key { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.82rem; color: var(--ink-2); margin: 6px 0 0; }
.aud-key b { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.seg-row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; }
.seg { display: inline-flex; flex-wrap: wrap; width: fit-content; border: 1.5px solid var(--accent); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 40px; padding: 5px 14px; cursor: pointer; color: var(--accent); font: inherit; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

    const headers = { "content-type": "application/json" };

// Checks a background job until it's finished, stopping if the person moves to another page

    if (view !== App.viewId) return;
    let job;

    if (view !== App.viewId) return;

    if (job.status !== "working") return;
  }

    h("div", { class: "stats" }, stat("Replies", fmt(r.used), `Aim: ${fmt(s.plan.target)}${r.excluded ? `. ${fmt(r.excluded)} left out` : ""}`), stat("Satisfied", good === null ? "–" : `${fmt(good)}%`, "Very or fairly"), stat("Dissatisfied", bad === null ? "–" : `${fmt(bad)}%`, "Very or fairly")));

        h("tbody", {}, q.options.map((o) => h("tr", {}, h("td", {}, o.label), h("td", { class: "r" }, `${fmt(o.pct)}%`), h("td", { class: "r" }, fmt(o.count)), h("td", { "aria-hidden": "true" }, h("div", { class: "meter" }, h("span", { style: { width: `${Math.min(100, o.pct)}%` } })))))))),

// People who filled it in themselves, beside the interviewers' figures rather than mixed in with them
function selfResults(d, answersOf) {

// ----- forms to print
async function printView(page, a, id, from, to) {
  const top = h("div", { class: "stack gap" }, loading("Preparing the forms…"));
  page.append(top);
  const view = App.viewId;
  let d;
  try { d = await API.call("/api/survey/get", { code: a.code, id }); } catch (e) { if (view === App.viewId) add(clear(top), failure(e)); return; }
  if (view !== App.viewId) return;
  if (d.paused) return add(clear(top), pausedNote());
  const s = d.survey;
  const first = Number.isInteger(from) && from > 0 ? from : 1, last = Number.isInteger(to) && to >= first ? Math.min(to, first + 999) : first;
  add(clear(top), h("div", { class: "page-head no-print" }, h("div", {}, h("h1", {}, "Forms to print"), h("p", {}, `Forms ${first} to ${last}, for ${s.title}. Print double-sided on A4.`)),

  const sheets = h("div", { class: "sheets" });
  for (let n = first; n <= last; n++) sheets.append(paperForm(s, d.questions, n));
  top.append(sheets);
}
